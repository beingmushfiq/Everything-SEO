name: 💬 General Feedback / Question
description: Ask a question, suggest an architectural improvement, or share general feedback
title: "[FEEDBACK]: <topic>"
labels: ["question", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about using the library with autonomous AI agents or adapting skills for enterprise workflows? Share your thoughts below.
  - type: textarea
    id: feedback_content
    attributes:
      label: Feedback / Question
      description: Describe your question or suggestion in detail.
      placeholder: "I'd like to share feedback regarding..."
    validations:
      required: true
