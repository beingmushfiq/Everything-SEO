[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "everything-seo-cli"
version = "1.1.0"
description = "Universal CLI and progressive skill manager for Everything SEO by DevCenterPoint"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DevCenterPoint", email = "maintainers@devcenterpoint.com" }
]
keywords = ["seo", "ai-agents", "cursor", "claude-code", "antigravity", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
everything-seo = "everything_seo_cli.cli:main"

[project.urls]
Homepage = "https://github.com/beingmushfiq/Everything-SEO"
Repository = "https://github.com/beingmushfiq/Everything-SEO.git"
Documentation = "https://github.com/beingmushfiq/Everything-SEO/blob/main/docs/UNIVERSAL_AGENT_INTEGRATION_GUIDE.md"
