name: Validate SEO Skills

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Skill Verification & Link Integrity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Skill Structure & Frontmatter Validator
        run: python scripts/validate_skills.py

      - name: Run Offline Internal Link Checker
        run: python scripts/check_links.py

      - name: Verify Index & Coverage Consistency
        run: python scripts/generate_index.py --check

      - name: Run Automated Unit Tests
        run: python -m unittest discover -s tests -p "test_*.py"
